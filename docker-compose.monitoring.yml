# OOA Monitoring Stack — Phase 2 (MONITORING_PLAN.md)
#
# Usage:
#   1. Start admin DB (optional, for postgres_exporter):
#        docker compose -f docker-compose.admin-db.yml up -d
#   2. Start gateway on host:
#        uvicorn gateway.main:app --host 0.0.0.0 --port 8000
#   3. Render Alertmanager config (Phase 6 — reads .env):
#        python scripts/render_alertmanager_config.py
#   4. Start monitoring:
#        docker compose -f docker-compose.monitoring.yml up -d
#   5. Verify:
#        ./scripts/verify_monitoring_stack.sh
#        ./scripts/verify_alerts.sh
#
# URLs:
#   Prometheus:    http://localhost:9090
#   Grafana:       http://localhost:3030  (admin / admin)
#   Loki:          http://localhost:3100
#   Alertmanager:  http://localhost:9093
#   cAdvisor:      http://localhost:8080
#
# Phase 3: gateway writes logs/ooa-gateway.jsonl — Promtail tails it into Loki.

name: ooa-monitoring

services:
  redis:
    image: redis:7-alpine
    container_name: ooa-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - monitoring

  redis_exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: ooa-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - monitoring

  # Optional local Postgres for metrics-only dev (skip if using admin-db on 5433)
  ooa-postgres-metrics:
    image: postgres:15-alpine
    container_name: ooa-postgres-metrics
    profiles: ["bundled-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: ooa
    volumes:
      - ooa-metrics-pg:/var/lib/postgresql/data
      - ./monitoring/postgres-init.sh:/docker-entrypoint-initdb.d/01-pg-stat.sh:ro
    networks:
      - monitoring

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: ooa-postgres-exporter
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Default: admin DB from docker-compose.admin-db.yml on host port 5433
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-postgresql://postgres:devpassword@host.docker.internal:5433/ooa?sslmode=disable}
    ports:
      - "9187:9187"
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ooa-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ooa-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ooa-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    depends_on:
      - alertmanager
      - redis_exporter
      - postgres_exporter
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ooa-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      # Generated from .env: python scripts/render_alertmanager_config.py
      - ./monitoring/alertmanager/alertmanager.generated.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.2.1
    container_name: ooa-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.2.1
    container_name: ooa-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/ooa:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ooa-grafana
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

networks:
  monitoring:
    name: ooa-monitoring

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  ooa-metrics-pg:
