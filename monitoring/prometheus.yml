# Prometheus configuration — OOA Phase 2
# Scrape the gateway on the host via host.docker.internal (Docker Desktop Mac/Win).
# On Linux, set OOA_METRICS_TARGET=ooa-gateway:8000 when running the gateway in Compose.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ooa-dev
    environment: development

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ooa-gateway
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 15s
    static_configs:
      # Gateway on host (uvicorn). Linux + gateway in Compose: use ooa-gateway:8000
      - targets: ["host.docker.internal:8000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
