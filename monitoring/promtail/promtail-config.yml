# Promtail — ships OOA gateway JSON logs and Docker container logs to Loki (Phase 3)
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Gateway on host writes logs/ooa-gateway.jsonl (see OOA_LOG_FILE)
  - job_name: ooa-gateway-file
    static_configs:
      - targets:
          - localhost
        labels:
          job: ooa-gateway
          service: ooa-gateway
          __path__: /var/log/ooa/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            request_id: request_id
            user_id: user_id
            category: category
            event: event
      - labels:
          level:
          category:
          event:

  # Docker container stdout/stderr (monitoring stack, postgres, etc.)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
